<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eeede8" />
    <script>
      try {
        const theme =
          localStorage.getItem("sidereal-theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        if (theme === "dark")
          document.querySelector('meta[name="theme-color"]').content =
            "#141513";
      } catch {}
    </script>
    <meta
      name="description"
      content="An observing desk for the night sky. Explore your sky, place it in context, and rehearse telescope movements."
    />
    <title>Starmap — An observing desk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
