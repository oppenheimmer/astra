name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # No python-version here on purpose: uv reads requires-python from
      # pyproject.toml and fetches that interpreter, so the version is declared
      # in one place and CI cannot drift from the deployed runtime.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync
      - name: Type-check and build
        run: npm run build
      - name: Frontend tests
        run: npm test
      - name: Backend tests
        run: npm run test:api
