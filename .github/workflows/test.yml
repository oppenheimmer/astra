name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      # No python-version here on purpose: uv reads requires-python from
      # pyproject.toml and fetches that interpreter, so the version is declared
      # in one place and CI cannot drift from the deployed runtime.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --locked
      - name: Type-check and build
        run: npm run build
      - name: Frontend tests
        run: npm test
      - name: Backend tests
        run: npm run test:api
