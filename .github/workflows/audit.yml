name: dependency-audit

on:
  schedule:
    - cron: "35 3 * * 1"
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/audit.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Audit locked JavaScript dependencies
        run: npm audit
      - name: Install the locked Python audit tool
        if: ${{ !cancelled() }}
        run: uv sync --locked --only-group audit
      - name: Audit locked Python runtime, test and operations dependencies
        if: ${{ !cancelled() }}
        run: |
          uv export --locked --no-hashes --no-emit-project --group ops --output-file /tmp/astra-audit-requirements.txt
          uv run --no-sync pip-audit --no-deps --disable-pip --requirement /tmp/astra-audit-requirements.txt
